<svg xmlns="http://www.w3.org/2000/svg" width="5380.75" height="342.88"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.2"/></filter></defs><rect width="5380.75" height="342.88" fill="white"/><text x="16" y="67.44" font-family="sans-serif" font-size="32" font-weight="bold">sss-wallpaper</text><text x="16" y="113.880005" font-family="sans-serif" font-size="16">ユーザータイプは自分。複数のスクリーンをWindows PCにつないでいる。</text><rect id="band-0" x="16" y="134.88" width="5348.75" height="48" fill="#e0efff"/><line x1="16" y1="181.88" x2="5364.75" y2="181.88" stroke="#bedeff" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-1" x="16" y="182.88" width="5348.75" height="48" fill="#e0ffee"/><line x1="16" y1="229.88" x2="5364.75" y2="229.88" stroke="#beffdc" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-2" x="16" y="230.88" width="5348.75" height="48" fill="#ffe0e9"/><line x1="16" y1="277.88" x2="5364.75" y2="277.88" stroke="#ffbed1" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-3" x="16" y="278.88" width="5348.75" height="48" fill="#fff3e0"/><line x1="16" y1="325.88" x2="5364.75" y2="325.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><text x="32" y="161.88" font-family="sans-serif" font-size="16" fill="#888888">Activity</text><text x="32" y="209.88" font-family="sans-serif" font-size="16" fill="#888888">Task</text><text x="32" y="257.88" font-family="sans-serif" font-size="16" fill="#888888">Walking Skeleton</text><text x="32" y="305.88" font-family="sans-serif" font-size="16" fill="#888888">ランダム表示</text><rect id="card-0" x="180.02344" y="143.88" width="732.41406" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="189.02344" y="163.88" font-family="sans-serif" font-size="16">準備</text><rect id="card-1" x="180.02344" y="191.88" width="732.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="189.02344" y="211.88" font-family="sans-serif" font-size="16">起動</text><rect id="card-2" x="179.02344" y="238.88" width="734.41406" height="28" rx="6" fill="#ffbed1"/><text x="187.02344" y="257.88" font-family="sans-serif" font-size="16">✅ ウィンドウありで起動</text><rect id="card-3" x="179.02344" y="286.88" width="734.41406" height="28" rx="6" fill="#ffe6be"/><text x="187.02344" y="305.88" font-family="sans-serif" font-size="16">✅ ウィンドウなし起動オプションでは、フォルダからランダムに選んで書き変えて自動終了する。</text><rect id="card-4" x="930.4375" y="143.88" width="348.41406" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="939.4375" y="163.88" font-family="sans-serif" font-size="16">表示</text><rect id="card-5" x="930.4375" y="191.88" width="348.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="939.4375" y="211.88" font-family="sans-serif" font-size="16">ウィンドウ表示</text><rect id="card-6" x="929.4375" y="238.88" width="350.41406" height="28" rx="6" fill="#ffbed1"/><text x="937.4375" y="257.88" font-family="sans-serif" font-size="16">✅ 全モニターの枠が左から右へ表示</text><rect id="card-7" x="929.4375" y="286.88" width="350.41406" height="28" rx="6" fill="#ffe6be"/><text x="937.4375" y="305.88" font-family="sans-serif" font-size="16">✅ モニターのサイズと向きが枠に反映される</text><rect id="card-8" x="1295.8516" y="286.88" width="334.41406" height="28" rx="6" fill="#ffe6be"/><text x="1303.8516" y="305.88" font-family="sans-serif" font-size="16">✅ 現在の壁紙がサムネイルで表示される。</text><rect id="card-9" x="1647.2656" y="191.88" width="796.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1656.2656" y="211.88" font-family="sans-serif" font-size="16">エラー表示</text><rect id="card-10" x="1646.2656" y="286.88" width="798.41406" height="28" rx="6" fill="#ffe6be"/><text x="1654.2656" y="305.88" font-family="sans-serif" font-size="16">✅ 読み書きに失敗すると、エラーダイアログで知らせる。設定ファイルが壊れていても、枠は表示される。</text><rect id="card-11" x="2461.6797" y="143.88" width="498.64063" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="2470.6797" y="163.88" font-family="sans-serif" font-size="16">壁紙設定</text><rect id="card-12" x="2461.6797" y="191.88" width="498.64063" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="2470.6797" y="211.88" font-family="sans-serif" font-size="16">変更</text><rect id="card-13" x="2460.6797" y="238.88" width="500.64063" height="28" rx="6" fill="#ffbed1"/><text x="2468.6797" y="257.88" font-family="sans-serif" font-size="16">✅ ファイルを枠へドロップすると、PCの壁紙にすぐ反映される。</text><rect id="card-14" x="2460.6797" y="286.88" width="500.64063" height="28" rx="6" fill="#ffe6be"/><text x="2468.6797" y="305.88" font-family="sans-serif" font-size="16">✅ フォルダを枠へドロップすると、フォルダが登録される。</text><rect id="card-15" x="2978.3203" y="191.88" width="668.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="2987.3203" y="211.88" font-family="sans-serif" font-size="16">場所を開く</text><rect id="card-16" x="2977.3203" y="286.88" width="670.41406" height="28" rx="6" fill="#ffe6be"/><text x="2985.3203" y="305.88" font-family="sans-serif" font-size="16">✅ 枠のボタンで、登録したフォルダか、画像のあるフォルダをエクスプローラーで開く。</text><rect id="card-17" x="3664.7344" y="191.88" width="590.1875" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="3673.7344" y="211.88" font-family="sans-serif" font-size="16">設定</text><rect id="card-18" x="3663.7344" y="238.88" width="592.1875" height="28" rx="6" fill="#ffbed1"/><text x="3671.7344" y="257.88" font-family="sans-serif" font-size="16">✅ 縦横比固定でFitするように表示。左寄せ、右寄せを選べる。白色で埋める。</text><rect id="card-19" x="3663.7344" y="286.88" width="592.1875" height="28" rx="6" fill="#ffe6be"/><text x="3671.7344" y="305.88" font-family="sans-serif" font-size="16">✅ 埋める色を白か黒か選べる。</text><rect id="card-20" x="4271.922" y="286.88" width="462.41406" height="28" rx="6" fill="#ffe6be"/><text x="4279.922" y="305.88" font-family="sans-serif" font-size="16">✅ 設定はモニターごとに保存され、次の起動でも使われる。</text><rect id="card-21" x="4751.336" y="191.88" width="604.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="4760.336" y="211.88" font-family="sans-serif" font-size="16">ランダム</text><rect id="card-22" x="4750.336" y="286.88" width="606.41406" height="28" rx="6" fill="#ffe6be"/><text x="4758.336" y="305.88" font-family="sans-serif" font-size="16">✅ ランダム変更ボタンを押すとすぐにフォルダからランダマイズで登録される。</text></svg>