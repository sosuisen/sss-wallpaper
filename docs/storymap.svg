<svg xmlns="http://www.w3.org/2000/svg" width="1951.0234" height="474.88"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.2"/></filter></defs><rect width="1951.0234" height="474.88" fill="white"/><text x="16" y="67.44" font-family="sans-serif" font-size="32" font-weight="bold">sss-wallpaper</text><text x="16" y="113.880005" font-family="sans-serif" font-size="16">ユーザータイプは自分。複数のスクリーンをWindows PCにつないでいる。</text><rect id="band-0" x="16" y="134.88" width="1919.0234" height="48" fill="#e0efff"/><line x1="16" y1="181.88" x2="1935.0234" y2="181.88" stroke="#bedeff" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-1" x="16" y="182.88" width="1919.0234" height="48" fill="#e0ffee"/><line x1="16" y1="229.88" x2="1935.0234" y2="229.88" stroke="#beffdc" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-2" x="16" y="230.88" width="1919.0234" height="104" fill="#ffe0e9"/><line x1="16" y1="333.88" x2="1935.0234" y2="333.88" stroke="#ffbed1" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-3" x="16" y="334.88" width="1919.0234" height="124" fill="#fff3e0"/><line x1="16" y1="457.88" x2="1935.0234" y2="457.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><text x="32" y="161.88" font-family="sans-serif" font-size="16" fill="#888888">Activity</text><text x="32" y="209.88" font-family="sans-serif" font-size="16" fill="#888888">Task</text><text x="32" y="257.88" font-family="sans-serif" font-size="16" fill="#888888">Walking Skeleton</text><text x="32" y="361.88" font-family="sans-serif" font-size="16" fill="#888888">ランダム表示</text><rect id="card-0" x="180.02344" y="143.88" width="178" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="189.02344" y="163.88" font-family="sans-serif" font-size="16">準備</text><rect id="card-1" x="180.02344" y="191.88" width="178" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="189.02344" y="211.88" font-family="sans-serif" font-size="16">起動</text><rect id="card-2" x="179.02344" y="238.88" width="180" height="88" rx="6" fill="#ffbed1"/><text x="187.02344" y="257.88" font-family="sans-serif" font-size="16">✅ ウィンドウありで</text><text x="187.02344" y="277.88" font-family="sans-serif" font-size="16">起動</text><rect id="card-3" x="179.02344" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="187.02344" y="361.88" font-family="sans-serif" font-size="16">✅ ウィンドウなし起</text><text x="187.02344" y="381.88" font-family="sans-serif" font-size="16">動オプションでは、</text><text x="187.02344" y="401.88" font-family="sans-serif" font-size="16">フォルダからランダム</text><text x="187.02344" y="421.88" font-family="sans-serif" font-size="16">に選んで書き変えて自</text><text x="187.02344" y="441.88" font-family="sans-serif" font-size="16">動終了する。</text><rect id="card-4" x="376.02344" y="143.88" width="178" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="385.02344" y="163.88" font-family="sans-serif" font-size="16">表示</text><rect id="card-5" x="376.02344" y="191.88" width="178" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="385.02344" y="211.88" font-family="sans-serif" font-size="16">ウィンドウ表示</text><rect id="card-6" x="375.02344" y="238.88" width="180" height="88" rx="6" fill="#ffbed1"/><text x="383.02344" y="257.88" font-family="sans-serif" font-size="16">✅ 全モニターの枠が</text><text x="383.02344" y="277.88" font-family="sans-serif" font-size="16">左から右へ表示</text><rect id="card-7" x="375.02344" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="383.02344" y="361.88" font-family="sans-serif" font-size="16">✅ モニターのサイズ</text><text x="383.02344" y="381.88" font-family="sans-serif" font-size="16">と向きが枠に反映され</text><text x="383.02344" y="401.88" font-family="sans-serif" font-size="16">る</text><rect id="card-8" x="571.02344" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="579.02344" y="361.88" font-family="sans-serif" font-size="16">✅ 現在の壁紙がサム</text><text x="579.02344" y="381.88" font-family="sans-serif" font-size="16">ネイルで表示される。</text><rect id="card-9" x="768.02344" y="191.88" width="178" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="777.02344" y="211.88" font-family="sans-serif" font-size="16">エラー表示</text><rect id="card-10" x="767.02344" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="775.02344" y="361.88" font-family="sans-serif" font-size="16">✅ 読み書きに失敗す</text><text x="775.02344" y="381.88" font-family="sans-serif" font-size="16">ると、エラーダイアロ</text><text x="775.02344" y="401.88" font-family="sans-serif" font-size="16">グで知らせる。設定</text><text x="775.02344" y="421.88" font-family="sans-serif" font-size="16">ファイルが壊れていて</text><text x="775.02344" y="441.88" font-family="sans-serif" font-size="16">も、枠は表示される。</text><rect id="card-11" x="964.02344" y="143.88" width="178" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="973.02344" y="163.88" font-family="sans-serif" font-size="16">壁紙設定</text><rect id="card-12" x="964.02344" y="191.88" width="178" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="973.02344" y="211.88" font-family="sans-serif" font-size="16">変更</text><rect id="card-13" x="963.02344" y="238.88" width="180" height="88" rx="6" fill="#ffbed1"/><text x="971.02344" y="257.88" font-family="sans-serif" font-size="16">✅ ファイルを枠へド</text><text x="971.02344" y="277.88" font-family="sans-serif" font-size="16">ロップすると、PCの壁</text><text x="971.02344" y="297.88" font-family="sans-serif" font-size="16">紙にすぐ反映される。</text><rect id="card-14" x="963.02344" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="971.02344" y="361.88" font-family="sans-serif" font-size="16">✅ フォルダを枠へド</text><text x="971.02344" y="381.88" font-family="sans-serif" font-size="16">ロップすると、フォル</text><text x="971.02344" y="401.88" font-family="sans-serif" font-size="16">ダが登録される。</text><rect id="card-15" x="1160.0234" y="191.88" width="178" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1169.0234" y="211.88" font-family="sans-serif" font-size="16">場所を開く</text><rect id="card-16" x="1159.0234" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="1167.0234" y="361.88" font-family="sans-serif" font-size="16">✅ 枠のボタンで、登</text><text x="1167.0234" y="381.88" font-family="sans-serif" font-size="16">録したフォルダか、画</text><text x="1167.0234" y="401.88" font-family="sans-serif" font-size="16">像のあるフォルダをエ</text><text x="1167.0234" y="421.88" font-family="sans-serif" font-size="16">クスプローラーで開</text><text x="1167.0234" y="441.88" font-family="sans-serif" font-size="16">く。</text><rect id="card-17" x="1356.0234" y="191.88" width="178" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1365.0234" y="211.88" font-family="sans-serif" font-size="16">設定</text><rect id="card-18" x="1355.0234" y="238.88" width="180" height="88" rx="6" fill="#ffbed1"/><text x="1363.0234" y="257.88" font-family="sans-serif" font-size="16">✅ 縦横比固定でFitす</text><text x="1363.0234" y="277.88" font-family="sans-serif" font-size="16">るように表示。左寄</text><text x="1363.0234" y="297.88" font-family="sans-serif" font-size="16">せ、右寄せを選べる。</text><text x="1363.0234" y="317.88" font-family="sans-serif" font-size="16">白色で埋める。</text><rect id="card-19" x="1355.0234" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="1363.0234" y="361.88" font-family="sans-serif" font-size="16">✅ 埋める色を白か黒</text><text x="1363.0234" y="381.88" font-family="sans-serif" font-size="16">か選べる。</text><rect id="card-20" x="1551.0234" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="1559.0234" y="361.88" font-family="sans-serif" font-size="16">✅ 設定はモニターご</text><text x="1559.0234" y="381.88" font-family="sans-serif" font-size="16">とに保存され、次の起</text><text x="1559.0234" y="401.88" font-family="sans-serif" font-size="16">動でも使われる。</text><rect id="card-21" x="1748.0234" y="191.88" width="178" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1757.0234" y="211.88" font-family="sans-serif" font-size="16">ランダム</text><rect id="card-22" x="1747.0234" y="342.88" width="180" height="108" rx="6" fill="#ffe6be"/><text x="1755.0234" y="361.88" font-family="sans-serif" font-size="16">✅ ランダム変更ボタ</text><text x="1755.0234" y="381.88" font-family="sans-serif" font-size="16">ンを押すとすぐにフォ</text><text x="1755.0234" y="401.88" font-family="sans-serif" font-size="16">ルダからランダマイズ</text><text x="1755.0234" y="421.88" font-family="sans-serif" font-size="16">で登録される。</text></svg>