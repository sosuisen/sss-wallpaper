<svg xmlns="http://www.w3.org/2000/svg" width="1771.0234" height="514.88"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.2"/></filter></defs><rect width="1771.0234" height="514.88" fill="white"/><text x="16" y="67.44" font-family="sans-serif" font-size="32" font-weight="bold">sss-wallpaper</text><text x="16" y="113.880005" font-family="sans-serif" font-size="16">ユーザータイプは自分。複数のスクリーンをWindows PCにつないでいる。</text><rect id="band-0" x="16" y="134.88" width="1739.0234" height="48" fill="#e0efff"/><line x1="16" y1="181.88" x2="1755.0234" y2="181.88" stroke="#bedeff" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-1" x="16" y="182.88" width="1739.0234" height="48" fill="#e0ffee"/><line x1="16" y1="229.88" x2="1755.0234" y2="229.88" stroke="#beffdc" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-2" x="16" y="230.88" width="1739.0234" height="124" fill="#ffe0e9"/><line x1="16" y1="353.88" x2="1755.0234" y2="353.88" stroke="#ffbed1" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-3" x="16" y="354.88" width="1739.0234" height="144" fill="#fff3e0"/><line x1="16" y1="497.88" x2="1755.0234" y2="497.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><text x="32" y="161.88" font-family="sans-serif" font-size="16" fill="#888888">Activity</text><text x="32" y="209.88" font-family="sans-serif" font-size="16" fill="#888888">Task</text><text x="32" y="257.88" font-family="sans-serif" font-size="16" fill="#888888">Walking Skeleton</text><text x="32" y="381.88" font-family="sans-serif" font-size="16" fill="#888888">ランダム表示</text><rect id="card-0" x="180.02344" y="143.88" width="158" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="189.02344" y="163.88" font-family="sans-serif" font-size="16">準備</text><rect id="card-1" x="180.02344" y="191.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="189.02344" y="211.88" font-family="sans-serif" font-size="16">起動</text><rect id="card-2" x="179.02344" y="238.88" width="160" height="108" rx="6" fill="#ffbed1"/><text x="187.02344" y="257.88" font-family="sans-serif" font-size="16">✅ ウィンドウあり</text><text x="187.02344" y="277.88" font-family="sans-serif" font-size="16">で起動</text><rect id="card-3" x="179.02344" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="187.02344" y="381.88" font-family="sans-serif" font-size="16">✅ ウィンドウなし</text><text x="187.02344" y="401.88" font-family="sans-serif" font-size="16">起動オプションで</text><text x="187.02344" y="421.88" font-family="sans-serif" font-size="16">は、フォルダから</text><text x="187.02344" y="441.88" font-family="sans-serif" font-size="16">ランダムに選んで</text><text x="187.02344" y="461.88" font-family="sans-serif" font-size="16">書き変えて自動終</text><text x="187.02344" y="481.88" font-family="sans-serif" font-size="16">了する。</text><rect id="card-4" x="356.02344" y="143.88" width="158" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="365.02344" y="163.88" font-family="sans-serif" font-size="16">表示</text><rect id="card-5" x="356.02344" y="191.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="365.02344" y="211.88" font-family="sans-serif" font-size="16">ウィンドウ表示</text><rect id="card-6" x="355.02344" y="238.88" width="160" height="108" rx="6" fill="#ffbed1"/><text x="363.02344" y="257.88" font-family="sans-serif" font-size="16">✅ 全モニターの枠</text><text x="363.02344" y="277.88" font-family="sans-serif" font-size="16">が左から右へ表示</text><rect id="card-7" x="355.02344" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="363.02344" y="381.88" font-family="sans-serif" font-size="16">✅ モニターのサイ</text><text x="363.02344" y="401.88" font-family="sans-serif" font-size="16">ズと向きが枠に反</text><text x="363.02344" y="421.88" font-family="sans-serif" font-size="16">映される</text><rect id="card-8" x="531.02344" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="539.02344" y="381.88" font-family="sans-serif" font-size="16">✅ 現在の壁紙がサ</text><text x="539.02344" y="401.88" font-family="sans-serif" font-size="16">ムネイルで表示さ</text><text x="539.02344" y="421.88" font-family="sans-serif" font-size="16">れる。</text><rect id="card-9" x="708.02344" y="191.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="717.02344" y="211.88" font-family="sans-serif" font-size="16">エラー表示</text><rect id="card-10" x="707.02344" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="715.02344" y="381.88" font-family="sans-serif" font-size="16">✅ 読み書きに失敗</text><text x="715.02344" y="401.88" font-family="sans-serif" font-size="16">すると、エラーダ</text><text x="715.02344" y="421.88" font-family="sans-serif" font-size="16">イアログで知らせ</text><text x="715.02344" y="441.88" font-family="sans-serif" font-size="16">る。設定ファイル</text><text x="715.02344" y="461.88" font-family="sans-serif" font-size="16">が壊れていても、</text><text x="715.02344" y="481.88" font-family="sans-serif" font-size="16">枠は表示される。</text><rect id="card-11" x="884.02344" y="143.88" width="158" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="893.02344" y="163.88" font-family="sans-serif" font-size="16">壁紙設定</text><rect id="card-12" x="884.02344" y="191.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="893.02344" y="211.88" font-family="sans-serif" font-size="16">変更</text><rect id="card-13" x="883.02344" y="238.88" width="160" height="108" rx="6" fill="#ffbed1"/><text x="891.02344" y="257.88" font-family="sans-serif" font-size="16">✅ ファイルを枠へ</text><text x="891.02344" y="277.88" font-family="sans-serif" font-size="16">ドロップすると、</text><text x="891.02344" y="297.88" font-family="sans-serif" font-size="16">PCの壁紙にすぐ反</text><text x="891.02344" y="317.88" font-family="sans-serif" font-size="16">映される。</text><rect id="card-14" x="883.02344" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="891.02344" y="381.88" font-family="sans-serif" font-size="16">✅ フォルダを枠へ</text><text x="891.02344" y="401.88" font-family="sans-serif" font-size="16">ドロップすると、</text><text x="891.02344" y="421.88" font-family="sans-serif" font-size="16">フォルダが登録さ</text><text x="891.02344" y="441.88" font-family="sans-serif" font-size="16">れる。</text><rect id="card-15" x="1060.0234" y="191.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1069.0234" y="211.88" font-family="sans-serif" font-size="16">場所を開く</text><rect id="card-16" x="1059.0234" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="1067.0234" y="381.88" font-family="sans-serif" font-size="16">✅ 枠のボタンで、</text><text x="1067.0234" y="401.88" font-family="sans-serif" font-size="16">登録したフォルダ</text><text x="1067.0234" y="421.88" font-family="sans-serif" font-size="16">か、画像のある</text><text x="1067.0234" y="441.88" font-family="sans-serif" font-size="16">フォルダをエクス</text><text x="1067.0234" y="461.88" font-family="sans-serif" font-size="16">プローラーで開</text><text x="1067.0234" y="481.88" font-family="sans-serif" font-size="16">く。</text><rect id="card-17" x="1236.0234" y="191.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1245.0234" y="211.88" font-family="sans-serif" font-size="16">設定</text><rect id="card-18" x="1235.0234" y="238.88" width="160" height="108" rx="6" fill="#ffbed1"/><text x="1243.0234" y="257.88" font-family="sans-serif" font-size="16">✅ 縦横比固定で</text><text x="1243.0234" y="277.88" font-family="sans-serif" font-size="16">Fitするように表</text><text x="1243.0234" y="297.88" font-family="sans-serif" font-size="16">示。左寄せ、右寄</text><text x="1243.0234" y="317.88" font-family="sans-serif" font-size="16">せを選べる。白色</text><text x="1243.0234" y="337.88" font-family="sans-serif" font-size="16">で埋める。</text><rect id="card-19" x="1235.0234" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="1243.0234" y="381.88" font-family="sans-serif" font-size="16">✅ 埋める色を白か</text><text x="1243.0234" y="401.88" font-family="sans-serif" font-size="16">黒か選べる。</text><rect id="card-20" x="1411.0234" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="1419.0234" y="381.88" font-family="sans-serif" font-size="16">✅ 設定はモニター</text><text x="1419.0234" y="401.88" font-family="sans-serif" font-size="16">ごとに保存され、</text><text x="1419.0234" y="421.88" font-family="sans-serif" font-size="16">次の起動でも使わ</text><text x="1419.0234" y="441.88" font-family="sans-serif" font-size="16">れる。</text><rect id="card-21" x="1588.0234" y="191.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1597.0234" y="211.88" font-family="sans-serif" font-size="16">ランダム</text><rect id="card-22" x="1587.0234" y="362.88" width="160" height="128" rx="6" fill="#ffe6be"/><text x="1595.0234" y="381.88" font-family="sans-serif" font-size="16">✅ ランダム変更ボ</text><text x="1595.0234" y="401.88" font-family="sans-serif" font-size="16">タンを押すとすぐ</text><text x="1595.0234" y="421.88" font-family="sans-serif" font-size="16">にフォルダからラ</text><text x="1595.0234" y="441.88" font-family="sans-serif" font-size="16">ンダマイズで登録</text><text x="1595.0234" y="461.88" font-family="sans-serif" font-size="16">される。</text></svg>