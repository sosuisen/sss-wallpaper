<svg xmlns="http://www.w3.org/2000/svg" width="2491.0234" height="434.88"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.2"/></filter></defs><rect width="2491.0234" height="434.88" fill="white"/><text x="16" y="67.44" font-family="sans-serif" font-size="32" font-weight="bold">sss-wallpaper</text><text x="16" y="113.880005" font-family="sans-serif" font-size="16">ユーザータイプは自分。複数のスクリーンをWindows PCにつないでいる。</text><rect id="band-0" x="16" y="134.88" width="2459.0234" height="48" fill="#e0efff"/><line x1="16" y1="181.88" x2="2475.0234" y2="181.88" stroke="#bedeff" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-1" x="16" y="182.88" width="2459.0234" height="48" fill="#e0ffee"/><line x1="16" y1="229.88" x2="2475.0234" y2="229.88" stroke="#beffdc" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-2" x="16" y="230.88" width="2459.0234" height="84" fill="#ffe0e9"/><line x1="16" y1="313.88" x2="2475.0234" y2="313.88" stroke="#ffbed1" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-3" x="16" y="314.88" width="2459.0234" height="104" fill="#fff3e0"/><line x1="16" y1="417.88" x2="2475.0234" y2="417.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><text x="32" y="161.88" font-family="sans-serif" font-size="16" fill="#888888">Activity</text><text x="32" y="209.88" font-family="sans-serif" font-size="16" fill="#888888">Task</text><text x="32" y="257.88" font-family="sans-serif" font-size="16" fill="#888888">Walking Skeleton</text><text x="32" y="341.88" font-family="sans-serif" font-size="16" fill="#888888">ランダム表示</text><rect id="card-0" x="180.02344" y="143.88" width="238" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="189.02344" y="163.88" font-family="sans-serif" font-size="16">準備</text><rect id="card-1" x="180.02344" y="191.88" width="238" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="189.02344" y="211.88" font-family="sans-serif" font-size="16">起動</text><rect id="card-2" x="179.02344" y="238.88" width="240" height="68" rx="6" fill="#ffbed1"/><text x="187.02344" y="257.88" font-family="sans-serif" font-size="16">✅ ウィンドウありで起動</text><rect id="card-3" x="179.02344" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="187.02344" y="341.88" font-family="sans-serif" font-size="16">✅ ウィンドウなし起動オプ</text><text x="187.02344" y="361.88" font-family="sans-serif" font-size="16">ションでは、フォルダからラ</text><text x="187.02344" y="381.88" font-family="sans-serif" font-size="16">ンダムに選んで書き変えて自</text><text x="187.02344" y="401.88" font-family="sans-serif" font-size="16">動終了する。</text><rect id="card-4" x="436.02344" y="143.88" width="238" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="445.02344" y="163.88" font-family="sans-serif" font-size="16">表示</text><rect id="card-5" x="436.02344" y="191.88" width="238" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="445.02344" y="211.88" font-family="sans-serif" font-size="16">ウィンドウ表示</text><rect id="card-6" x="435.02344" y="238.88" width="240" height="68" rx="6" fill="#ffbed1"/><text x="443.02344" y="257.88" font-family="sans-serif" font-size="16">✅ 全モニターの枠が左から右</text><text x="443.02344" y="277.88" font-family="sans-serif" font-size="16">へ表示</text><rect id="card-7" x="435.02344" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="443.02344" y="341.88" font-family="sans-serif" font-size="16">✅ モニターのサイズと向きが</text><text x="443.02344" y="361.88" font-family="sans-serif" font-size="16">枠に反映される</text><rect id="card-8" x="691.02344" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="699.02344" y="341.88" font-family="sans-serif" font-size="16">✅ 現在の壁紙がサムネイルで</text><text x="699.02344" y="361.88" font-family="sans-serif" font-size="16">表示される。</text><rect id="card-9" x="948.02344" y="191.88" width="238" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="957.02344" y="211.88" font-family="sans-serif" font-size="16">エラー表示</text><rect id="card-10" x="947.02344" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="955.02344" y="341.88" font-family="sans-serif" font-size="16">✅ 読み書きに失敗すると、エ</text><text x="955.02344" y="361.88" font-family="sans-serif" font-size="16">ラーダイアログで知らせる。</text><text x="955.02344" y="381.88" font-family="sans-serif" font-size="16">設定ファイルが壊れていて</text><text x="955.02344" y="401.88" font-family="sans-serif" font-size="16">も、枠は表示される。</text><rect id="card-11" x="1204.0234" y="143.88" width="238" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="1213.0234" y="163.88" font-family="sans-serif" font-size="16">壁紙設定</text><rect id="card-12" x="1204.0234" y="191.88" width="238" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1213.0234" y="211.88" font-family="sans-serif" font-size="16">変更</text><rect id="card-13" x="1203.0234" y="238.88" width="240" height="68" rx="6" fill="#ffbed1"/><text x="1211.0234" y="257.88" font-family="sans-serif" font-size="16">✅ ファイルを枠へドロップす</text><text x="1211.0234" y="277.88" font-family="sans-serif" font-size="16">ると、PCの壁紙にすぐ反映さ</text><text x="1211.0234" y="297.88" font-family="sans-serif" font-size="16">れる。</text><rect id="card-14" x="1203.0234" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="1211.0234" y="341.88" font-family="sans-serif" font-size="16">✅ フォルダを枠へドロップす</text><text x="1211.0234" y="361.88" font-family="sans-serif" font-size="16">ると、フォルダが登録され</text><text x="1211.0234" y="381.88" font-family="sans-serif" font-size="16">る。</text><rect id="card-15" x="1460.0234" y="191.88" width="238" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1469.0234" y="211.88" font-family="sans-serif" font-size="16">場所を開く</text><rect id="card-16" x="1459.0234" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="1467.0234" y="341.88" font-family="sans-serif" font-size="16">✅ 枠のボタンで、登録した</text><text x="1467.0234" y="361.88" font-family="sans-serif" font-size="16">フォルダか、画像のあるフォ</text><text x="1467.0234" y="381.88" font-family="sans-serif" font-size="16">ルダをエクスプローラーで開</text><text x="1467.0234" y="401.88" font-family="sans-serif" font-size="16">く。</text><rect id="card-17" x="1716.0234" y="191.88" width="238" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1725.0234" y="211.88" font-family="sans-serif" font-size="16">設定</text><rect id="card-18" x="1715.0234" y="238.88" width="240" height="68" rx="6" fill="#ffbed1"/><text x="1723.0234" y="257.88" font-family="sans-serif" font-size="16">✅ 縦横比固定でFitするよう</text><text x="1723.0234" y="277.88" font-family="sans-serif" font-size="16">に表示。左寄せ、右寄せを選</text><text x="1723.0234" y="297.88" font-family="sans-serif" font-size="16">べる。白色で埋める。</text><rect id="card-19" x="1715.0234" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="1723.0234" y="341.88" font-family="sans-serif" font-size="16">✅ 埋める色を白か黒か選べ</text><text x="1723.0234" y="361.88" font-family="sans-serif" font-size="16">る。</text><rect id="card-20" x="1971.0234" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="1979.0234" y="341.88" font-family="sans-serif" font-size="16">✅ 設定はモニターごとに保存</text><text x="1979.0234" y="361.88" font-family="sans-serif" font-size="16">され、次の起動でも使われ</text><text x="1979.0234" y="381.88" font-family="sans-serif" font-size="16">る。</text><rect id="card-21" x="2228.0234" y="191.88" width="238" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="2237.0234" y="211.88" font-family="sans-serif" font-size="16">ランダム</text><rect id="card-22" x="2227.0234" y="322.88" width="240" height="88" rx="6" fill="#ffe6be"/><text x="2235.0234" y="341.88" font-family="sans-serif" font-size="16">✅ ランダム変更ボタンを押す</text><text x="2235.0234" y="361.88" font-family="sans-serif" font-size="16">とすぐにフォルダからランダ</text><text x="2235.0234" y="381.88" font-family="sans-serif" font-size="16">マイズで登録される。</text></svg>