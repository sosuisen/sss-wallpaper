name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  test:
    # DesktopWallpaperService calls Windows COM through FFM, so the tests need Windows.
    runs-on: windows-latest
    steps:
      # The Windows runner checks out with CRLF by default, but the formatter expects LF.
      - run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: mvn -B formatter:validate

      # Stops at test, because package runs jpackage.
      - name: Compile with NullAway and run tests
        run: mvn -B clean test

      # The reports are needed only to read why a test failed.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  package:
    # A pull request does not need an exe to try.
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      # Community Edition, because Oracle GraalVM needs the GFTC license checked. See ADR 2.
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          version: '25.4'
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The test job has already run the tests on the same commit.
      - name: Build the native exe
        run: mvn -B -Pnative clean package -DskipTests

      # A missing registration in the metadata fails only at run time, not at build time.
      - name: Run the native exe without a window
        shell: bash
        run: ./target/sss-wallpaper.exe -Dsss.settings.file="$RUNNER_TEMP/settings.properties" --randomize

      # The exe does not run without the DLLs for AWT and ImageIO.
      - name: Upload the native exe
        uses: actions/upload-artifact@v7
        with:
          name: sss-wallpaper-${{ github.sha }}
          path: |
            target/sss-wallpaper.exe
            target/*.dll
          retention-days: 7
