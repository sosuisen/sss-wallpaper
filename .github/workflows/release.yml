name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # jpackage on Windows accepts only numbers and dots, such as 1.2.0.
      - name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::The tag must look like v1.2.0: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # A release runs the tests again, because a tag can point to any commit.
      - name: Test and build the app image
        run: mvn -B clean package "-Dapp.version=$APP_VERSION"

      - name: Zip the app image
        shell: pwsh
        run: Compress-Archive -Path target/jpackage/sss-wallpaper -DestinationPath "sss-wallpaper-$env:APP_VERSION.zip"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "sss-wallpaper-$APP_VERSION.zip" --title "$GITHUB_REF_NAME" --generate-notes
